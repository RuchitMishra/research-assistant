<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Research Assistant</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2333;--mut:#6b7385;--line:#e4e8f1;--pri:#4f46e5;--pri2:#eef0ff;
--kb:#0f9d6b;--kb2:#e3f6ee;--web:#2563eb;--web2:#e5eeff;--mix:#7c3aed;--mix2:#f0e8ff;--warn:#b45309;--warn2:#fff3dd;--nf:#6b7385;--nf2:#eceef3}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(120deg,#312e81,#4f46e5);color:#fff;padding:16px 28px;display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:19px;font-weight:650}header p{margin:2px 0 0;font-size:12.5px;opacity:.8}
header a{color:#fff;font-size:13px;text-decoration:none;border:1px solid rgba(255,255,255,.4);padding:6px 12px;border-radius:8px}
.wrap{display:grid;grid-template-columns:310px 1fr;gap:18px;max-width:1280px;margin:18px auto;padding:0 18px;height:calc(100vh - 100px)}
@media(max-width:850px){.wrap{grid-template-columns:1fr;height:auto}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0}
.ph{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.ph small{color:var(--mut);font-weight:400}
#docs{overflow:auto;padding:8px 10px;flex:1;min-height:120px}
.doc{display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px}.doc:hover{background:var(--bg)}
.ic{width:34px;height:34px;border-radius:8px;background:var(--pri2);color:var(--pri);display:grid;place-items:center;font-size:10px;font-weight:700;flex:none}
.doc .n{flex:1;min-width:0;font-size:13.5px}.doc .n b{display:block;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .n span{color:var(--mut);font-size:12px}.doc button{border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px;padding:4px 8px;border-radius:6px}.doc button:hover{background:#fde8e8;color:#c0392b}
#drop{margin:10px;border:2px dashed #c7cbe8;border-radius:12px;padding:16px;text-align:center;color:var(--mut);font-size:13px;cursor:pointer;transition:.15s}
#drop.over,#drop:hover{border-color:var(--pri);background:var(--pri2);color:var(--pri)}#up{font-size:12px;color:var(--mut);padding:0 14px 12px;min-height:16px}
#chatpanel{min-height:0}#chat{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:16px}
.empty{margin:auto;text-align:center;color:var(--mut);max-width:440px}.empty h2{color:var(--ink);margin:0 0 6px;font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font-size:13px;cursor:pointer;color:var(--ink)}.chip:hover{border-color:var(--pri);color:var(--pri)}
.u{align-self:flex-end;background:var(--pri);color:#fff;padding:10px 15px;border-radius:16px 16px 4px 16px;max-width:75%}
.a{align-self:stretch}.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:850px){.cmp{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:650;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;text-transform:none;letter-spacing:0}
.knowledge_base{background:var(--kb2);color:var(--kb)}.web{background:var(--web2);color:var(--web)}.mixed{background:var(--mix2);color:var(--mix)}
.clarification_needed{background:var(--warn2);color:var(--warn)}.not_found,.error{background:var(--nf2);color:var(--nf)}
.ans{white-space:pre-wrap;word-wrap:break-word}.ans ul{margin:6px 0;padding-left:20px}
details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--mut)}
.src{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-top:8px;font-size:13px;background:#fafbfe}
.src b{font-weight:600}.src .m{color:var(--mut);font-size:12px;margin-left:6px}.src p{margin:4px 0 0;color:#444;font-size:12.5px}
.src a{color:var(--web);text-decoration:none}.step{display:flex;gap:9px;margin-top:7px;font-size:12.5px;align-items:flex-start}
.step i{font-style:normal;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--pri2);color:var(--pri);flex:none;text-transform:uppercase}
.step span{color:#444}.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--pri);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}@keyframes b{50%{opacity:.2;transform:translateY(-3px)}}
.bar{border-top:1px solid var(--line);padding:12px 14px}.row{display:flex;gap:10px}
.row input{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font-size:15px;outline:none}.row input:focus{border-color:var(--pri)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:11px;padding:0 22px;font-weight:600;cursor:pointer;font-size:14.5px}.btn:disabled{opacity:.5}
.opts{display:flex;gap:16px;margin-top:9px;font-size:12.5px;color:var(--mut);align-items:center}.opts label{cursor:pointer;display:flex;gap:6px;align-items:center}
.opts a{margin-left:auto;color:var(--mut);cursor:pointer;text-decoration:underline}
</style></head><body>
<header><div><h1>Multi-Step Research Assistant</h1><p>Plans, retrieves, grades its own evidence, then falls back to the web only when needed</p></div><a href="/docs">API docs</a></header>
<div class="wrap">
 <div class="panel"><div class="ph">Knowledge base <small id="cnt"></small></div>
  <div id="docs"></div>
  <div id="drop" onclick="fi.click()">Drop files here or click to upload<br><small>PDF, DOCX, HTML, TXT, PNG/JPG</small></div>
  <input type="file" id="fi" multiple hidden><div id="up"></div></div>
 <div class="panel" id="chatpanel">
  <div id="chat"></div>
  <div class="bar"><div class="row"><input id="q" placeholder="Ask a question about your documents..." autocomplete="off"><button class="btn" id="go">Ask</button></div>
   <div class="opts"><label><input type="checkbox" id="cmp"> Compare with naive RAG</label><a onclick="reset()">New conversation</a></div></div>
 </div>
</div>
<script>
const $=id=>document.getElementById(id);const newId=()=>'web-'+Math.random().toString(36).slice(2,9);let sid=newId();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^[\*\-] (.+)$/gm,'• $1');
const LABEL={knowledge_base:'From knowledge base',web:'From the web',mixed:'Knowledge base + web',clarification_needed:'Needs clarification',not_found:'Not found',error:'Error'};
const SAMPLES=['Summarize the main topics covered in the knowledge base','Compare the key points of two of the documents','Who is the current Prime Minister of Japan?','Tell me more about it'];
function empty(){$('chat').innerHTML=`<div class="empty"><h2>Ask anything about your documents</h2>Complex questions are split into sub-questions; if the documents can't answer, I search the web and say so.<div class="chips">${SAMPLES.map(s=>`<span class="chip" onclick="q.value=this.textContent;ask()">${esc(s)}</span>`).join('')}</div></div>`}
function reset(){sid=newId();empty()}
async function loadDocs(){try{const d=await (await fetch('/documents')).json();$('cnt').textContent=d.length+' file'+(d.length==1?'':'s');
 $('docs').innerHTML=d.length?d.map(x=>`<div class="doc"><div class="ic">${esc((x.filename||'').split('.').pop().slice(0,4).toUpperCase())}</div><div class="n"><b title="${esc(x.filename)}">${esc(x.filename)}</b><span>${x.chunks} chunks</span></div><button title="Remove" onclick="del('${esc(x.doc_id)}')">×</button></div>`).join(''):'<div style="padding:14px;color:var(--mut);font-size:13px">No documents yet. Upload some below.</div>'}catch(e){$('docs').textContent='Could not load documents'}}
async function del(id){if(!confirm('Remove this document?'))return;await fetch('/documents/'+id,{method:'DELETE'});loadDocs()}
async function upload(files){if(!files.length)return;const fd=new FormData();for(const f of files)fd.append('files',f);$('up').textContent='Ingesting '+files.length+' file(s)... this can take a minute';
 try{const d=await (await fetch('/documents',{method:'POST',body:fd})).json();$('up').innerHTML=d.map(x=>esc(x.filename)+': <b>'+esc(x.status)+'</b>').join('<br>')}catch(e){$('up').textContent='Upload failed: '+e}loadDocs()}
fi.onchange=()=>{upload(fi.files);fi.value=''};
['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over')}));drop.addEventListener('drop',ev=>upload(ev.dataTransfer.files));
function card(d,label){if(!d||!d.answer)return `<div class="card"><div class="lab">${label}<span class="badge error">Error</span></div>${esc((d&&d.detail)||'Request failed. Gemini free tier may be rate limited; wait a minute and retry.')}</div>`;
 const cites=(d.citations||[]).map(c=>`<div class="src"><b>${esc(c.doc)}</b><span class="m">${c.page?'page '+c.page+' · ':''}relevance ${c.score??''}</span><p>${esc((c.snippet||'').slice(0,220))}…</p></div>`).join('');
 const web=(d.web_sources||[]).map(w=>`<div class="src"><a href="${esc(w.url)}" target="_blank" rel="noopener"><b>${esc(w.title||w.url)}</b></a><span class="m">${esc((w.url||'').replace(/^https?:\/\//,'').slice(0,50))}</span></div>`).join('');
 const steps=(d.reasoning_trace||[]).map(t=>{const i=t.indexOf(':');const k=i>0?t.slice(0,i):'step';return `<div class="step"><i>${esc(k.replace(/\s*\(.*\)/,''))}</i><span>${esc(i>0?t.slice(i+1).trim():t)}</span></div>`}).join('');
 return `<div class="card"><div class="lab">${label}<span class="badge ${d.answer_source}">${LABEL[d.answer_source]||d.answer_source}</span></div><div class="ans">${md(d.answer)}</div>
 ${cites?`<details open><summary>Knowledge base sources (${d.citations.length})</summary>${cites}</details>`:''}${web?`<details open><summary>Web sources (${d.web_sources.length})</summary>${web}</details>`:''}
 <details><summary>How this answer was produced</summary>${steps}</details></div>`}
async function call(p,question){try{const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,session_id:sid})});return await r.json()}catch(e){return{detail:String(e)}}}
async function ask(){const question=q.value.trim();if(!question)return;q.value='';go.disabled=true;const chat=$('chat');
 if(chat.querySelector('.empty'))chat.innerHTML='';chat.insertAdjacentHTML('beforeend',`<div class="u">${esc(question)}</div>`);
 const slot=document.createElement('div');slot.className='a';slot.innerHTML='<div class="card"><div class="dots"><span></span><span></span><span></span></div></div>';chat.appendChild(slot);chat.scrollTop=chat.scrollHeight;
 const cmp=$('cmp').checked;const [a,n]=await Promise.all([call('/ask',question),cmp?call('/ask-naive',question):null]);
 slot.innerHTML=n?`<div class="cmp">${card(a,'Multi-step graph')}${card(n,'Naive RAG (baseline)')}</div>`:card(a,'Multi-step graph');
 go.disabled=false;chat.scrollTop=chat.scrollHeight;q.focus()}
go.onclick=ask;q.onkeydown=e=>{if(e.key==='Enter')ask()};empty();loadDocs();
</script></body></html>
